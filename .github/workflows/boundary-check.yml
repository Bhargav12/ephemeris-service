name: Architecture separation check

# NOTE: this is no longer enforcing a legal/licensing boundary — both
# ephemeris-service and panchanga-core are AGPL-3.0 and public (see
# docs/product-plan.md §11). This check is retained purely as an
# architecture/style guard to keep domain logic out of this service.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  forbidden-terms:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for panchanga-specific terms
        run: |
          set -e
          FORBIDDEN='tithi|nakshatra|karana|rahu.?kalam|yamaganda|gulika|muhurta|ayanamsa|panchanga'
          # Exclude lines explicitly marked as documentation about the boundary itself.
          MATCHES=$(grep -RIiE "$FORBIDDEN" --include="*.py" --exclude-dir=".git" . | grep -v "boundary-check-ignore" || true)
          if [ -n "$MATCHES" ]; then
            echo "$MATCHES"
            echo "::error::Found panchanga-specific term(s) in ephemeris-service."
            echo "This repo must stay generic. Move this logic to panchanga-core instead."
            exit 1
          fi
          echo "OK: no panchanga-specific terms found."
